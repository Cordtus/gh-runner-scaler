# gh-runner-scaler configuration
# Secrets are set via environment variables (see systemd unit), not in this file.

[scaler]
prefix = "gh-runner-auto"
max_auto_runners = 6
idle_timeout = "300s"
poll_interval = "30s"
labels = "self-hosted,linux,x64,runner-class-default"
runner_work_dir = "_work"

[container]
provider = "lxd"               # future: "docker", "gce", etc.
template = "gh-runner-template"

[container.lxd]
socket = ""                    # empty = default LXD socket
remote = ""                    # empty = local; e.g. "lxd-prod" for remote host
# remote_url = ""              # HTTPS remote URL
# remote_cert = ""             # client certificate path
# remote_key = ""              # client key path

[cache]
enabled = false
pool = ""                      # ZFS pool name (e.g. "runner-pool")
volume = ""                    # ZFS volume name (e.g. "runner-cache")
# When enabled, the scaler also prepares /cache/buildx and writes
# RUNNER_BUILDX_CACHE_ROOT=/cache/buildx plus DOCKER_BUILDKIT=1 into
# /home/runner/.env so workflows can opt into Docker Buildx local cache
# exports with explicit --cache-from/--cache-to type=local arguments.

[cache.prune]
enabled = true
interval = "24h"               # real cleanup runs at most once per interval
max_age = "336h"               # remove stale cache dirs after 14 days
temp_max_age = "6h"            # remove abandoned *-next exports after 6 hours; keep longer than expected builds
paths = ["/cache/buildx"]      # specific shared-cache roots to prune

[[cache.symlinks]]
source = "/cache/npm"
target = "/home/runner/.npm"

[[cache.symlinks]]
source = "/cache/yarn"
target = "/home/runner/.cache/yarn"

[[cache.symlinks]]
source = "/cache/pip"
target = "/home/runner/.cache/pip"

[[cache.symlinks]]
source = "/cache/tool-cache"
target = "/opt/hostedtoolcache"
# When this target is present, the scaler also writes AGENT_TOOLSDIRECTORY and
# RUNNER_TOOL_CACHE into /home/runner/.env before installing the runner service.

# Add repo-specific cache mounts only for repositories currently served by
# this scaler target.
# [[cache.symlinks]]
# source = "/cache/example-repo"
# target = "/opt/example-repo"

[ci]
provider = "github"            # future: "gitlab", etc.
org = ""                       # org-scoped runners; set either org or repo
# repo = ""                    # repo-scoped runners for one repository, owner/name
# Token: set GH_SCALER_GITHUB_TOKEN env var
# Fine-grained org target permissions:
# - Organization: Self-hosted runners (read/write)
# - Repository: Actions (read) when workflow metrics are enabled
# - Repository: Metadata (read) when org workflow metrics are enabled
# Fine-grained repo target permissions:
# - Repository: Administration (write)
# - Repository: Actions (read) when workflow metrics are enabled
# Classic PAT org target scopes: admin:org, plus repo for private repo workflow metrics.
# Repo-scoped personal targets require repository admin access; classic PAT scope: repo.

[ci.github]
# Webhook secret: set GH_WEBHOOK_SECRET env var

# Optional multi-class router configuration.
# If no [[runner_classes]] entries are present, the daemon synthesizes a single
# "default" runner class from [scaler], [container], [cache], and [ci] above.
# Add runner classes when one scaler process should manage multiple logical
# runner types with different labels, templates, caps, or cache profiles.
#
# [cache_profiles.node]
# enabled = true
# pool = "runner-pool"
# volume = "runner-cache-node"
#
# [cache_profiles.node.prune]
# enabled = true
# interval = "24h"
# max_age = "336h"
# temp_max_age = "6h"
# paths = ["/cache/buildx"]
#
# [[cache_profiles.node.symlinks]]
# source = "/cache/npm"
# target = "/home/runner/.npm"
#
# [[cache_profiles.node.symlinks]]
# source = "/cache/tool-cache"
# target = "/opt/hostedtoolcache"
#
# [cache_profiles.rust]
# enabled = true
# pool = "runner-pool"
# volume = "runner-cache-rust"
#
# [cache_profiles.rust.prune]
# enabled = true
# interval = "24h"
# max_age = "336h"
# temp_max_age = "6h"
# paths = ["/cache/buildx"]
#
# [[cache_profiles.rust.symlinks]]
# source = "/cache/cargo-registry"
# target = "/home/runner/.cargo/registry"
#
# [[cache_profiles.rust.symlinks]]
# source = "/cache/cargo-git"
# target = "/home/runner/.cargo/git"
#
# [[runner_classes]]
# id = "typescript-standard"
# org = "ExampleOrg"
# prefix = "ts-runner"
# labels = "self-hosted,linux,x64,runner-class-typescript"
# match_labels = ["self-hosted", "linux", "x64", "runner-class-typescript"]
# max_auto_runners = 8
# idle_timeout = "300s"
# runner_work_dir = "_work"
# template = "gh-runner-template-typescript"
# cache_profile = "node"
#
# [[runner_classes]]
# id = "rust-standard"
# org = "ExampleOrg"
# prefix = "rust-runner"
# labels = "self-hosted,linux,x64,runner-class-rust"
# match_labels = ["self-hosted", "linux", "x64", "runner-class-rust"]
# max_auto_runners = 6
# idle_timeout = "300s"
# runner_work_dir = "_work"
# template = "gh-runner-template-rust"
# cache_profile = "rust"

# Personal repositories are repo-scoped, not owner-wide. Add one runner class
# per personal repository that should use this platform.
# [[runner_classes]]
# id = "personal-example"
# repo = "octo-user/example-repo"
# prefix = "gh-runner-personal-example"
# labels = "self-hosted,linux,x64,runner-class-personal"
# match_labels = ["self-hosted", "linux", "x64", "runner-class-personal"]
# max_auto_runners = 2
# runner_work_dir = "_work"
# template = "gh-runner-template"

[webhook]
enabled = true
port = 9876
debounce = "2s"
# Optional: set GH_SCALER_LOG_TOKEN env var to protect GET /logs with a
# dedicated bearer token. If unset, the daemon falls back to GH_WEBHOOK_SECRET.

[webhook.sync_repos]
# Pushes to each repo's default branch trigger cache syncs for these repos.
# Key = repo full name, value = path on cache volume.
# "ExampleOrg/example-repo" = "/cache/example-repo"

[metrics]
enabled = false
interval = "60s"
collect_workflows = true
workflow_repo_batch_size = 25     # 0 = scan every repo each interval
collect_host = true
# Lower GitHub API load by keeping this interval at or above the default and
# keeping workflow_repo_batch_size bounded for large orgs.

[metrics.loki]
# Set via env: LOKI_PUSH_URL. If Loki requires basic auth, also set
# LOKI_USERNAME and LOKI_API_KEY or LOKI_PASSWORD.

[state]
provider = "filesystem"        # future: "supabase", "redis", etc.

[state.filesystem]
dir = "/var/lib/gh-runner-scaler/state"
