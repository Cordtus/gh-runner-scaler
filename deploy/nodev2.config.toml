# nodev2 production config.
# Secrets are loaded from /etc/gh-runner-scaler/env.

[scaler]
prefix = "gh-runner-auto"
max_auto_runners = 6
idle_timeout = "600s"
poll_interval = "30s"
queue_audit_interval = "5m"
demand_ttl = "30m"
labels = "self-hosted,linux,x64,runner-class-cac"
runner_work_dir = "_work"

[container]
provider = "lxd"
template = "gh-runner-template"

[container.lxd]
socket = ""
remote = ""

[cache]
enabled = true
pool = "pool9"
volume = "runner-cache"

[cache.prune]
enabled = true
interval = "24h"
max_age = "336h"
temp_max_age = "6h"
paths = ["/cache/buildx"]

[cache_profiles.node]
enabled = true
pool = "pool9"
volume = "runner-cache"

[cache_profiles.node.prune]
enabled = true
interval = "24h"
max_age = "336h"
temp_max_age = "6h"
paths = ["/cache/buildx"]

[[cache_profiles.node.symlinks]]
source = "/cache/npm"
target = "/home/runner/.npm"

[[cache_profiles.node.symlinks]]
source = "/cache/pnpm"
target = "/home/runner/.local/share/pnpm/store"

[[cache_profiles.node.symlinks]]
source = "/cache/tool-cache"
target = "/opt/hostedtoolcache"

[cache_profiles.node-foundry]
enabled = true
pool = "pool9"
volume = "runner-cache-foundry"

[cache_profiles.node-foundry.prune]
enabled = true
interval = "24h"
max_age = "336h"
temp_max_age = "6h"
paths = ["/cache/buildx"]

[[cache_profiles.node-foundry.symlinks]]
source = "/cache/npm"
target = "/home/runner/.npm"

[[cache_profiles.node-foundry.symlinks]]
source = "/cache/pnpm"
target = "/home/runner/.local/share/pnpm/store"

[[cache_profiles.node-foundry.symlinks]]
source = "/cache/foundry"
target = "/home/runner/.foundry"

[[cache_profiles.node-foundry.symlinks]]
source = "/cache/tool-cache"
target = "/opt/hostedtoolcache"

[cache_profiles.node-browser]
enabled = true
pool = "pool9"
volume = "runner-cache-browser"

[cache_profiles.node-browser.prune]
enabled = true
interval = "24h"
max_age = "336h"
temp_max_age = "6h"
paths = ["/cache/buildx"]

[[cache_profiles.node-browser.symlinks]]
source = "/cache/npm"
target = "/home/runner/.npm"

[[cache_profiles.node-browser.symlinks]]
source = "/cache/pnpm"
target = "/home/runner/.local/share/pnpm/store"

[[cache_profiles.node-browser.symlinks]]
source = "/cache/ms-playwright"
target = "/home/runner/.cache/ms-playwright"

[[cache_profiles.node-browser.symlinks]]
source = "/cache/tool-cache"
target = "/opt/hostedtoolcache"

[[cache.symlinks]]
source = "/cache/npm"
target = "/home/runner/.npm"

[[cache.symlinks]]
source = "/cache/yarn"
target = "/home/runner/.cache/yarn"

[[cache.symlinks]]
source = "/cache/pip"
target = "/home/runner/.cache/pip"

[[cache.symlinks]]
source = "/cache/tool-cache"
target = "/opt/hostedtoolcache"

[ci]
provider = "github"
org = "CAC-Group"

[ci.github]

[[runner_classes]]
id = "cac-group"
org = "CAC-Group"
prefix = "gh-runner-cac"
labels = "self-hosted,linux,x64,nodev2,docker,runner-class-cac"
match_labels = ["self-hosted", "linux", "x64", "runner-class-cac"]
max_auto_runners = 6
runner_work_dir = "_work"
template = "gh-runner-template"

[[runner_classes]]
id = "gh-runner-scaler"
repo = "Cordtus/gh-runner-scaler"
prefix = "gh-runner-scaler"
labels = "self-hosted,linux,x64,nodev2,docker,runner-class-gh-runner-scaler"
match_labels = ["self-hosted", "linux", "x64", "nodev2", "docker", "runner-class-gh-runner-scaler"]
max_auto_runners = 4
runner_work_dir = "_work"
template = "gh-runner-template"

[[runner_classes]]
id = "the-clearooor"
repo = "Cordtus/the-clearooor"
prefix = "gh-runner-the-clearooor"
labels = "self-hosted,linux,x64,nodev2,docker,the-clearooor"
match_labels = ["self-hosted", "linux", "x64", "nodev2", "docker", "the-clearooor"]
max_auto_runners = 4
runner_work_dir = "_work"
template = "gh-runner-template"

[[runner_classes]]
id = "qmkui"
repo = "Cordtus/qmkui"
prefix = "gh-runner-qmkui"
labels = "self-hosted,linux,x64,nodev2,docker,runner-class-qmkui"
match_labels = ["self-hosted", "linux", "x64", "nodev2", "docker", "runner-class-qmkui"]
max_auto_runners = 2
runner_work_dir = "_work"
template = "gh-runner-template"

[[runner_classes]]
id = "node"
repo = "Cordtus/poolbet"
prefix = "gh-runner-node"
labels = "self-hosted,linux,x64,nodev2,docker,runner-class-node"
match_labels = ["self-hosted", "linux", "x64", "nodev2", "docker", "runner-class-node"]
max_auto_runners = 2
runner_work_dir = "_work"
template = "gh-runner-template"
cache_profile = "node"
baseline = true
baseline_name = "gh-runner-primary"

[[runner_classes]]
id = "node-foundry"
repo = "Cordtus/poolbet"
prefix = "gh-runner-node-foundry"
labels = "self-hosted,linux,x64,nodev2,docker,runner-class-node-foundry"
match_labels = ["self-hosted", "linux", "x64", "nodev2", "docker", "runner-class-node-foundry"]
max_auto_runners = 2
runner_work_dir = "_work"
template = "gh-runner-template"
cache_profile = "node-foundry"

[[runner_classes]]
id = "node-browser"
repo = "Cordtus/poolbet"
prefix = "gh-runner-node-browser"
labels = "self-hosted,linux,x64,nodev2,docker,runner-class-node-browser"
match_labels = ["self-hosted", "linux", "x64", "nodev2", "docker", "runner-class-node-browser"]
max_auto_runners = 2
runner_work_dir = "_work"
template = "gh-runner-template"
cache_profile = "node-browser"

[webhook]
enabled = true
port = 9876
debounce = "2s"

[webhook.sync_repos]

[metrics]
enabled = true
interval = "60s"
collect_workflows = true
workflow_repo_batch_size = 25
collect_host = true

[metrics.loki]

[runner_observability]
# Endpoint values come from RUNNER_LOG_LOKI_PUSH_URL and
# RUNNER_LOG_LOKI_HEALTH_URL in /etc/gh-runner-scaler/env. They must point to
# the internal unauthenticated Loki service; credentials are never copied into runners.
enabled = true
max_retries = 3
initial_backoff = "1s"
max_backoff = "1m"
max_source_bytes = 16777216
max_lifecycle_bytes = 134217728

[runner_distribution]
enabled = true
repository = "actions/runner"
platform = "linux-x64"
cache_dir = "/var/lib/gh-runner-scaler/runner-distributions"
version_file = "/var/lib/gh-runner-scaler/runner-distributions/current-version"
check_interval = "24h"
retain_versions = 2

[state]
provider = "filesystem"

[state.filesystem]
dir = "/var/lib/gh-runner-scaler/state"
